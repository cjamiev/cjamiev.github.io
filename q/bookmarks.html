<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bookmark Manager</title>
  <link rel="stylesheet" href="common.css" />
  <link rel="stylesheet" href="bookmarks.css" />
</head>

<body>
  <div id="alert-msg" class="alert-msg">Successfully Copied</div>

  <div class="container">
    <h1>My Bookmarks</h1>

    <div id="bookmark-container" class="form-container">
      <div class="input-group">
        <div class="form-group flex-1">
          <label for="nameInput">Name:</label>
          <input type="text" id="nameInput" placeholder="Name" />
        </div>
        
        <div class="form-group flex-1">
          <label for="typeInput">Type:</label>
          <input type="text" id="typeInput" placeholder="Other" />
          <div id="type-tags" class="type-tags-container"></div>
        </div>
      </div>

      <div class="form-group">
        <label for="urlInput">URL:</label>
        <input type="url" id="urlInput" placeholder="https://example.com" />
      </div>

      <div class="input-group">
        <div class="form-group flex-1">
          <label for="usernameInput">Username:</label>
          <input type="text" id="usernameInput" placeholder="Enter site username" />
        </div>

        <div class="form-group flex-1">
          <label for="passwordInput">Password:</label>
          <input type="text" id="passwordInput" placeholder="Enter site password"></input>
        </div>
      </div>

      <div class="form-group">
          <label for="isFavoriteInput">Is Favorite:</label>
          <input type="checkbox" id="isFavoriteInput" class="is-favorite-checkbox"></input>
      </div>

      <div id="bookmarkId" data-id=""></div>

      <div class="btn-group">
        <button id="save-btn" class="save-btn" onclick="addBookmark()">Save</button>
      </div>
    </div>

    <div class="search-container">
      <input type="text" id="searchInput" class="search-input" placeholder="Search" onkeyup="filterBookmarks()" />
      <button id="add-btn" class="add-btn" onclick="toggleAddForm()">Add</button>
    </div>
  </div>

  <div class="container">    
    <div class="edit-container">
      <button id="edit-btn" class="add-btn" onclick="toggleEditMode()">Edit</button>
    </div>
    <div id="bookmarkList" class="bookmark-list"></div>
  </div>

  <script src="utils.js"></script>
  <script src="bookmarks.js"></script>
</body>

</html>
